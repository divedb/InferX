syntax = "proto3";

package inference.scheduler.v1;

service Scheduler {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc Subscribe(SubscribeRequest) returns (stream GenerationEvent);
  rpc Cancel(CancelRequest) returns (OperationResponse);
  rpc GetStatus(GetStatusRequest) returns (StatusResponse);
  rpc UpdatePriority(UpdatePriorityRequest) returns (OperationResponse);
}

enum WorkloadClass {
  WORKLOAD_CLASS_UNSPECIFIED = 0;
  WORKLOAD_CLASS_GENERATION = 1;
  WORKLOAD_CLASS_EMBEDDING = 2;
}

enum PriorityClass {
  PRIORITY_CLASS_UNSPECIFIED = 0;
  PRIORITY_CLASS_INTERACTIVE = 1;
  PRIORITY_CLASS_BATCH = 2;
  PRIORITY_CLASS_BACKGROUND = 3;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
  FINISH_REASON_CANCELLED = 3;
  FINISH_REASON_FAILED = 4;
}

message TraceContext {
  string traceparent = 1;
  string tracestate = 2;
}

message SamplingParams {
  int32 max_tokens = 1;
  float temperature = 2;
  float top_p = 3;
  uint64 seed = 4;
  repeated string stop = 5;

  // Fields 6+ are append-only vLLM-compatible sampling extensions. Old
  // servers ignore them; old clients leave them at proto3 defaults, which
  // are all "feature off".
  int32 top_k = 6;
  float min_p = 7;
  float presence_penalty = 8;
  float frequency_penalty = 9;
  // 0 on the wire means "unset" (proto3 default); the receiver treats it as
  // the neutral 1.0.
  float repetition_penalty = 10;
  repeated int32 stop_token_ids = 11;
  bool ignore_eos = 12;
  int32 min_tokens = 13;
  bool want_logprobs = 14;
  int32 top_logprobs = 15;
  // Inverted from the API's skip_special_tokens so the proto3 default
  // (false) matches vLLM's default behavior (skip = true).
  bool keep_special_tokens = 16;
  bool include_stop_str_in_output = 17;
}

message TopLogprob {
  int32 token_id = 1;
  float logprob = 2;
}

// Log-probabilities for one generated token: the chosen token's logprob and
// up to top_logprobs alternatives, most probable first.
message TokenLogprobs {
  int32 token_id = 1;
  float logprob = 2;
  repeated TopLogprob top = 3;
}

message SubmitRequest {
  string request_id = 1;
  uint32 attempt = 2;
  string tenant_id = 3;
  string model_version = 4;
  WorkloadClass workload = 5;
  PriorityClass priority = 6;
  repeated int32 prompt_tokens = 7;
  SamplingParams sampling = 8;
  string tokenizer_revision = 9;
  int64 deadline_unix_millis = 10;
  TraceContext trace = 11;
}

message SubmitResponse {
  string request_id = 1;
  uint32 attempt = 2;
}

message SubscribeRequest {
  string request_id = 1;
  uint32 attempt = 2;
  uint64 after_sequence_number = 3;
}

message Usage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
}

message EmbeddingResult {
  uint32 index = 1;
  repeated float values = 2;
}

message RpcError {
  int32 code = 1;
  string message = 2;
}

message GenerationEvent {
  string request_id = 1;
  uint32 attempt = 2;
  uint64 sequence_number = 3;
  bytes text_delta = 4;
  repeated int32 token_ids = 5;
  repeated EmbeddingResult embeddings = 6;
  uint32 generated_tokens = 7;
  bool terminal = 8;
  FinishReason finish_reason = 9;
  Usage usage = 10;
  RpcError error = 11;
  // Parallel to token_ids; present only when the request asked for logprobs.
  repeated TokenLogprobs logprobs = 12;
}

message CancelRequest {
  string request_id = 1;
  uint32 attempt = 2;
  int32 reason = 3;
}

message GetStatusRequest {
  string request_id = 1;
  uint32 attempt = 2;
}

message StatusResponse {
  bool found = 1;
  string request_id = 2;
  uint32 attempt = 3;
  int32 state = 4;
  int64 received_unix_millis = 5;
  int64 deadline_unix_millis = 6;
  int64 completed_unix_millis = 7;
}

message UpdatePriorityRequest {
  string request_id = 1;
  uint32 attempt = 2;
  PriorityClass priority = 3;
}

message OperationResponse {}
